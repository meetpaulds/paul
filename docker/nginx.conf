server {
    listen      80;
    root        /usr/share/nginx/html;
    index       index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /react {
        return 301 /react/;
    }

    location = /vue {
        return 301 /vue/;
    }

    location = /svelte {
        return 301 /svelte/;
    }

    location = /angular {
        return 301 /angular/;
    }

    location /react/ {
        proxy_pass http://127.0.0.1:6006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /vue/ {
        proxy_pass http://127.0.0.1:6007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /svelte/ {
        proxy_pass http://127.0.0.1:6008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /angular/ {
        proxy_pass http://127.0.0.1:6009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# React Storybook — port 6006
server {
    listen      6006;
    root        /usr/share/nginx/storybook;
    index       index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

