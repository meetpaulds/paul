name: Publish npm Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/ui-react/package.json').version")
          NPM_VERSION=$(npm view @meetpaul/ui-react version 2>/dev/null || echo "0.0.0")
          
          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new! Proceeding to publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Await CI checks
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI workflow on $GITHUB_SHA to complete..."
          # Wait up to 10 minutes for CI to turn 'success'
          for i in {1..20}; do
            STATUS=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --json conclusion,status -q '.[0]')
            RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
            
            if [ "$RUN_STATUS" = "completed" ]; then
              if [ "$RUN_CONCLUSION" = "success" ]; then
                echo "CI completed successfully!"
                break
              else
                echo "CI failed. Aborting publish."
                exit 1
              fi
            fi
            
            echo "CI is still running... waiting 30 seconds."
            sleep 30
          done

      - name: Setup pnpm
        if: steps.check_version.outputs.should_publish == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.check_version.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm build

      - name: Publish all public packages
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm -r publish --access public --no-git-checks --provenance --filter="./packages/*"

      - name: Create and Push Git Tag
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.check_version.outputs.version }}
          git push origin v${{ steps.check_version.outputs.version }}
