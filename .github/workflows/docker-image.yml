name: Build Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paul-storybooks
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-infra:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Create infra dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_APP_PRIVATE_KEY }}
          owner: SirPauls
          repositories: sirpauls-infra

      - name: Dispatch infra deployment
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
          INFRA_REPOSITORY: SirPauls/sirpauls-infra
          SERVICE_NAME: paul
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Could not create the infra dispatch token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<JSON
          {
            "event_type": "service-image-published",
            "client_payload": {
              "service": "${SERVICE_NAME}",
              "image": "ghcr.io/${{ github.repository_owner }}/paul-storybooks:latest",
              "sha": "${IMAGE_SHA}",
              "tag": "${IMAGE_TAG}",
              "source_run_url": "${SOURCE_RUN_URL}"
            }
          }
          JSON
