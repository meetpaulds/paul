name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Chromatic requires full git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Validate APCA compliance
        run: pnpm run validate:apca
        working-directory: packages/tokens

      - name: Upload APCA validation report
        if: always()
        run: pnpm run validate:apca:json
        working-directory: packages/tokens

      - name: Upload APCA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apca-validation-report
          path: packages/tokens/apca-report.json
          retention-days: 30

      - name: Build storybook
        run: pnpm build:storybook

      - name: Publish to Chromatic
        run: pnpm chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --storybook-build-dir=storybook-static --exit-once-uploaded
        working-directory: apps/storybook
