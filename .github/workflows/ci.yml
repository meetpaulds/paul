name: CI

run-name: CI - ${{ github.event.pull_request.title || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy Storybook to GitHub Pages
        type: boolean
        default: true
      publish_docker:
        description: Build Docker image and notify infra
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Unit tests & APCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Validate APCA compliance
        run: pnpm run validate:apca
        working-directory: packages/tokens

      - name: Generate APCA JSON report
        if: always()
        run: pnpm run validate:apca:json
        working-directory: packages/tokens

      - name: Upload APCA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apca-validation-report
          path: packages/tokens/apca-report.json
          retention-days: 30

  build:
    name: Build packages & Storybooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Storybooks
        run: pnpm build:storybook

      - name: Upload Storybook artifact
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook-react/storybook-static

  deploy-pages:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: [check, test, build]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [check, test, build]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/paul-storybooks
      sha: ${{ github.sha }}
      tag: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paul-storybooks
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-infra:
    name: Notify infra
    runs-on: ubuntu-latest
    needs: docker-image
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_docker) }}
    steps:
      - name: Create infra dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_APP_PRIVATE_KEY }}
          owner: SirPauls
          repositories: sirpauls-infra

      - name: Dispatch infra deployment
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.docker-image.outputs.digest }}
          IMAGE_NAME: ${{ needs.docker-image.outputs.image }}
          IMAGE_SHA: ${{ needs.docker-image.outputs.sha }}
          IMAGE_TAG: ${{ needs.docker-image.outputs.tag }}
          INFRA_REPOSITORY: SirPauls/sirpauls-infra
          SERVICE_NAME: paul
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Could not create the infra dispatch token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<JSON
          {
            "event_type": "service-image-published",
            "client_payload": {
              "service": "${SERVICE_NAME}",
              "image": "${IMAGE_NAME}:latest",
              "digest": "${IMAGE_DIGEST}",
              "sha": "${IMAGE_SHA}",
              "tag": "${IMAGE_TAG}",
              "source_run_url": "${SOURCE_RUN_URL}"
            }
          }
          JSON
